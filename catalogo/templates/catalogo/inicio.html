
<form method="get" action="{% url 'inicio' %}">
    <label for="buscar-juego">Buscar juegos</label>
    <input
        type="search"
        id="buscar-juego"
        name="nombre"
        value="{{ nombre }}"
        placeholder="Escribe el nombre de un juego"
    >
    <button type="submit">Buscar</button>
</form>

{%for juego in juegos%}

    <div>
        <h3>{{ juego.nombre }}</h3>
        <p>Categoria: {{ juego.categoria.nombre }}</p>
        <p>Descripción: {{ juego.descripcion }}</p>
        <p>Edad recomendada: {{ juego.edad_minima }}</p>
        <p>Stock: {{ juego.stock }}</p>
        <p>Disponible: {{ juego.disponible }}</p>
        <p>Precio: ${{ juego.precio }}</p>
        <img src="{{ juego.imagen.url }}" alt="{{ juego.nombre }}">

    </div>
{%endfor%}
